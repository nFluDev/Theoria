# Theoria mod listesi — TEK KAYNAK. pack/packwiz/ bundan üretilir: python3 -I tools/pack/sync_packwiz.py
# Her giriş: slug (Modrinth) = sürüm numarası (NeoForge 26.3). Doğrulama: python3 -I tools/modmatrix/matrix.py (çıkış 0 = tüm sabitler mevcut)
# ve python3 -I tools/check_pack.py (bu liste ≡ packwiz metadosyaları). Mod eklemek = buraya satır + sync (docs/11 tablosu ayrıca güncellenir).
# Shader mimarisi (D19): Vulkan-yerli Vitrail; Iris YOK, OpenGL hedeflenmez.

